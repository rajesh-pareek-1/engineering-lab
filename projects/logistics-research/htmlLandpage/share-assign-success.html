<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Attached Successfully</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── Phone Frame ── */
    .phone {
      width: 390px;
      min-height: 844px;
      background: #ffffff;
      border-radius: 44px;
      border: 10px solid #1a1a2e;
      box-shadow:
        0 0 0 2px #2e2e4a,
        0 30px 80px rgba(0,0,0,0.35),
        inset 0 0 0 1px rgba(255,255,255,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Notch */
    .notch {
      width: 120px;
      height: 30px;
      background: #1a1a2e;
      border-radius: 0 0 20px 20px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 24px 4px;
      background: #ffffff;
      flex-shrink: 0;
    }
    .status-bar .time { font-size: 13px; font-weight: 600; color: #111; }
    .status-bar .icons { display: flex; gap: 6px; align-items: center; }
    .status-bar .icons svg { fill: #111; }

    /* Success body */
    .body {
      flex: 1;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 28px 40px;
      text-align: center;
    }

    /* Success check ring */
    .check-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #f0fdf4;
      border: 3px solid #bbf7d0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .check-ring svg { stroke: #16a34a; stroke-width: 2.5; fill: none; }

    .success-title {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    .success-sub {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Shipment reference chip */
    .shipment-ref {
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      width: 100%;
    }
    .ref-icon {
      width: 36px;
      height: 36px;
      background: #dcfce7;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ref-icon svg { stroke: #16a34a; stroke-width: 2; fill: none; }
    .ref-info { text-align: left; }
    .ref-label { font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.4px; }
    .ref-num { font-size: 15px; font-weight: 800; color: #111827; letter-spacing: -0.2px; margin-top: 2px; }

    /* Attached document row */
    .doc-row {
      background: #fafafa;
      border: 1px solid #f0f0f5;
      border-radius: 13px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 32px;
      width: 100%;
    }
    .doc-icon {
      width: 34px;
      height: 34px;
      background: #ede9fe;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .doc-icon svg { stroke: #7c3aed; stroke-width: 1.6; fill: none; }
    .doc-info { text-align: left; flex: 1; min-width: 0; }
    .doc-name { font-size: 13px; font-weight: 700; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-meta { font-size: 11.5px; color: #9ca3af; margin-top: 1px; }
    .doc-check { width: 20px; height: 20px; background: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .doc-check svg { stroke: #16a34a; stroke-width: 2.5; fill: none; }

    /* CTA */
    .btn-done {
      width: 100%;
      height: 54px;
      background: #16a34a;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: 0 4px 14px rgba(22,163,74,0.35);
      font-family: inherit;
    }
    .btn-done svg { stroke: #fff; stroke-width: 2.5; fill: none; }

    /* Home indicator */
    .home-indicator {
      height: 24px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .home-indicator span {
      width: 120px;
      height: 4px;
      background: #1a1a2e;
      border-radius: 4px;
      opacity: 0.25;
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- Notch -->
  <div class="notch"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">10:41</span>
    <div class="icons">
      <svg width="17" height="12" viewBox="0 0 17 12">
        <rect x="0"  y="8"  width="3" height="4" rx="1"/>
        <rect x="4.5" y="5" width="3" height="7" rx="1"/>
        <rect x="9" y="2.5" width="3" height="9.5" rx="1"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12">
        <path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
        <path d="M3.5 6.5a6.5 6.5 0 019 0" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M1 3.5a10 10 0 0114 0" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12">
        <rect x="0" y="1" width="21" height="10" rx="2.5" stroke="#111" stroke-width="1.2" fill="none"/>
        <rect x="1.5" y="2.5" width="15" height="7" rx="1.5" fill="#111"/>
        <path d="M22 4v4a2 2 0 000-4z"/>
      </svg>
    </div>
  </div>

  <!-- Success body -->
  <div class="body">

    <div class="check-ring">
      <svg width="40" height="40" viewBox="0 0 40 40">
        <polyline points="9,20 17,28 31,12" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="success-title">Document Attached<br>Successfully</div>
    <div class="success-sub">The document has been linked<br>to the selected shipment.</div>

    <!-- Shipment reference -->
    <div class="shipment-ref">
      <div class="ref-icon">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <rect x="1" y="3" width="14" height="10" rx="2"/>
          <path d="M1 6.5h14"/>
          <path d="M5 3V1.5M11 3V1.5"/>
        </svg>
      </div>
      <div class="ref-info">
        <div class="ref-label">Attached to Shipment</div>
        <div class="ref-num">SHP-2025-00142</div>
      </div>
    </div>

    <!-- Attached document -->
    <div class="doc-row">
      <div class="doc-icon">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <rect x="2" y="1" width="12" height="14" rx="2"/>
          <path d="M9 1v5h5"/>
          <line x1="5" y1="9" x2="11" y2="9" stroke-linecap="round"/>
          <line x1="5" y1="12" x2="9" y2="12" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="doc-info">
        <div class="doc-name">delivery_receipt.jpg</div>
        <div class="doc-meta">1.2 MB · JPEG</div>
      </div>
      <div class="doc-check">
        <svg width="10" height="10" viewBox="0 0 10 10">
          <polyline points="2,5 4,7 8,3"/>
        </svg>
      </div>
    </div>

    <button class="btn-done">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <polyline points="3,9 7,13 15,5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Done
    </button>

  </div>

  <!-- Home Indicator -->
  <div class="home-indicator"><span></span></div>

</div><!-- /phone -->

</body>
</html>
