<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chillbee Logistics – SHP-2025-00139</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f3f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 64px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #111827;
    }

    /* ── Wordmark ── */
    .wordmark {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .wordmark-icon {
      width: 32px; height: 32px;
      background: #2563eb;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
    }
    .wordmark-icon svg { stroke: #fff; stroke-width: 2; fill: none; }
    .wordmark-text {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.3px;
    }
    .wordmark-text span { color: #2563eb; }

    /* ── Main Card ── */
    .card {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #e5e7eb;
      box-shadow:
        0 1px 4px rgba(0,0,0,0.05),
        0 8px 32px rgba(0,0,0,0.07);
      overflow: hidden;
    }

    /* ── Card Header ── */
    .card-header {
      padding: 24px 28px 22px;
      border-bottom: 1px solid #f3f4f6;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .shipment-num {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      letter-spacing: -0.5px;
    }
    .badge-shared {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.3px;
      background: #f0fdf4; color: #15803d;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-shared::before {
      content: ''; width: 6px; height: 6px;
      border-radius: 50%; background: #22c55e; flex-shrink: 0;
    }

    /* Meta row */
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
    }
    .meta-item {
      padding: 0 16px 0 0;
    }
    .meta-item + .meta-item {
      padding-left: 16px;
      border-left: 1px solid #f0f0f5;
    }
    .meta-label {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .meta-value {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    /* ── POD Section ── */
    .pod-section {
      padding: 24px 28px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .section-label svg {
      width: 13px; height: 13px;
      stroke: #9ca3af; fill: none; stroke-width: 1.6;
    }

    /* POD Image Placeholder */
    .pod-image {
      width: 100%;
      aspect-ratio: 4/3;
      background: linear-gradient(160deg, #f8f9fb 0%, #eef0f5 100%);
      border-radius: 14px;
      border: 1.5px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }

    /* Faint ruled lines to suggest a paper document */
    .pod-image::before {
      content: '';
      position: absolute;
      inset: 32px 48px;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 28px,
        #e5e7eb 28px,
        #e5e7eb 29px
      );
      opacity: 0.5;
    }

    .pod-image svg {
      position: relative;
      stroke: #9ca3af;
      stroke-width: 1.3;
      fill: none;
    }
    .pod-image .doc-name {
      position: relative;
      font-size: 13.5px;
      font-weight: 600;
      color: #6b7280;
    }
    .pod-image .doc-meta {
      position: relative;
      font-size: 12px;
      color: #9ca3af;
    }

    /* Timestamp row */
    .pod-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
    }
    .pod-footer svg {
      width: 13px; height: 13px;
      stroke: #9ca3af; fill: none; flex-shrink: 0;
    }
    .pod-footer span { font-size: 12.5px; color: #9ca3af; font-weight: 400; }

    /* ── Divider ── */
    .divider { height: 1px; background: #f3f4f6; margin: 0 28px; }

    /* ── Download Section ── */
    .download-section {
      padding: 20px 28px 24px;
    }
    .btn-download {
      width: 100%;
      height: 52px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: 0 4px 14px rgba(37,99,235,0.28);
      font-family: inherit;
      letter-spacing: -0.1px;
    }
    .btn-download svg { stroke: #fff; stroke-width: 2.2; fill: none; }

    /* ── Footer note ── */
    .page-footer {
      margin-top: 24px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      line-height: 1.6;
    }
    .page-footer a { color: #6b7280; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>

  <!-- Wordmark -->
  <div class="wordmark">
    <div class="wordmark-icon">
      <svg width="17" height="17" viewBox="0 0 17 17">
        <rect x="2" y="5" width="13" height="10" rx="2"/>
        <path d="M2 8h13"/>
        <path d="M6 5V3M11 5V3"/>
      </svg>
    </div>
    <span class="wordmark-text">Chillbee <span>Logistics</span></span>
  </div>

  <!-- Main Card -->
  <div class="card">

    <!-- Header -->
    <div class="card-header">
      <div class="header-top">
        <span class="shipment-num">SHP-2025-00139</span>
        <span class="badge-shared">Shared</span>
      </div>
      <div class="meta-grid">
        <div class="meta-item">
          <div class="meta-label">Transporter</div>
          <div class="meta-value">Anil Pareek</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Vehicle No.</div>
          <div class="meta-value">KA 09 AB 3312</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Driver</div>
          <div class="meta-value">Suresh Yadav</div>
        </div>
      </div>
    </div>

    <!-- POD Section -->
    <div class="pod-section">
      <div class="section-label">
        <svg viewBox="0 0 13 13">
          <rect x="1.5" y="0.5" width="10" height="12" rx="1.5"/>
          <path d="M4 4h5M4 6.5h5M4 9h3" stroke-linecap="round"/>
        </svg>
        Proof of Delivery
      </div>

      <!-- Document visual -->
      <div class="pod-image">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <rect x="10" y="4" width="26" height="36" rx="3"/>
          <path d="M30 4v9h16" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="30,4 46,13 46,40 10,40 10,4"/>
          <circle cx="18" cy="20" r="3" stroke-width="1.3"/>
          <line x1="14" y1="29" x2="38" y2="29" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="14" y1="33" x2="30" y2="33" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span class="doc-name">pod_delivery_receipt.jpg</span>
        <span class="doc-meta">1.2 MB · JPEG image</span>
      </div>

      <!-- Upload timestamp -->
      <div class="pod-footer">
        <svg viewBox="0 0 13 13">
          <circle cx="6.5" cy="6.5" r="5.5"/>
          <path d="M6.5 3.5v3l2 1.5" stroke-linecap="round"/>
        </svg>
        <span>Uploaded 21 Feb 2025, 05:30 AM · by Suresh Yadav</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Download -->
    <div class="download-section">
      <button class="btn-download">
        <svg width="17" height="17" viewBox="0 0 17 17">
          <path d="M8.5 2v9" stroke-linecap="round"/>
          <path d="M5 8l3.5 3.5L12 8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 13.5h13" stroke-linecap="round"/>
        </svg>
        Download POD
      </button>
    </div>

  </div>

  <!-- Footer -->
  <p class="page-footer">
    Shared via <a href="#">Chillbee Logistics</a> · This link expires on 23 Mar 2025
  </p>

</body>
</html>
