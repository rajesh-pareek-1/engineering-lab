<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver – Upload POD</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── Phone Frame ── */
    .phone {
      width: 390px;
      min-height: 844px;
      background: #0a0a0f;
      border-radius: 44px;
      border: 10px solid #1a1a2e;
      box-shadow:
        0 0 0 2px #2e2e4a,
        0 30px 80px rgba(0,0,0,0.45),
        inset 0 0 0 1px rgba(255,255,255,0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Notch */
    .notch {
      width: 120px;
      height: 30px;
      background: #1a1a2e;
      border-radius: 0 0 20px 20px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    /* Status Bar – dark */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 24px 4px;
      background: transparent;
      flex-shrink: 0;
    }
    .status-bar .time { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); }
    .status-bar .icons { display: flex; gap: 6px; align-items: center; }
    .status-bar .icons svg { fill: rgba(255,255,255,0.8); }

    /* ── Top Bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 6px;
      flex-shrink: 0;
    }
    .close-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .close-btn svg { stroke: rgba(255,255,255,0.85); stroke-width: 2; fill: none; }

    .top-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .top-label .instruction {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.1px;
    }
    .top-label .shp-ref {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .flash-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .flash-btn svg { stroke: rgba(255,255,255,0.85); stroke-width: 1.8; fill: none; }

    /* ── Viewfinder ── */
    .viewfinder {
      flex: 1;
      margin: 8px 16px;
      border-radius: 20px;
      background: #111118;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle noise/grain texture via radial gradient */
    .viewfinder::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(255,255,255,0.025) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 70%, rgba(255,255,255,0.015) 0%, transparent 50%);
    }

    /* Document outline inside viewfinder */
    .doc-outline {
      position: relative;
      width: 76%;
      aspect-ratio: 3/4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 28px; height: 28px;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.7);
      border-radius: 2px;
    }
    .corner.tl { top: 0; left: 0; }
    .corner.tl::before { top: 0; left: 0; width: 28px; height: 3px; }
    .corner.tl::after  { top: 0; left: 0; width: 3px; height: 28px; }

    .corner.tr { top: 0; right: 0; }
    .corner.tr::before { top: 0; right: 0; width: 28px; height: 3px; }
    .corner.tr::after  { top: 0; right: 0; width: 3px; height: 28px; }

    .corner.bl { bottom: 0; left: 0; }
    .corner.bl::before { bottom: 0; left: 0; width: 28px; height: 3px; }
    .corner.bl::after  { bottom: 0; left: 0; width: 3px; height: 28px; }

    .corner.br { bottom: 0; right: 0; }
    .corner.br::before { bottom: 0; right: 0; width: 28px; height: 3px; }
    .corner.br::after  { bottom: 0; right: 0; width: 3px; height: 28px; }

    /* Centre hint */
    .doc-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0.35;
    }
    .doc-hint svg { stroke: #ffffff; stroke-width: 1.2; fill: none; }
    .doc-hint span {
      font-size: 12px;
      color: #ffffff;
      font-weight: 500;
      text-align: center;
      line-height: 1.5;
      letter-spacing: 0.1px;
    }

    /* ── Bottom Action Bar ── */
    .bottom-bar {
      padding: 16px 20px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      background: rgba(0,0,0,0.35);
    }

    .btn-retake {
      flex: 1;
      height: 54px;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.85);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      letter-spacing: -0.1px;
    }
    .btn-retake svg { stroke: rgba(255,255,255,0.8); stroke-width: 2.2; fill: none; }

    .btn-confirm {
      flex: 1.8;
      height: 54px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(37,99,235,0.45);
      font-family: inherit;
      letter-spacing: -0.1px;
    }
    .btn-confirm svg { stroke: #fff; stroke-width: 2.2; fill: none; }

    /* Home indicator */
    .home-indicator {
      height: 22px;
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .home-indicator span {
      width: 120px; height: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- Notch -->
  <div class="notch"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">10:41</span>
    <div class="icons">
      <svg width="17" height="12" viewBox="0 0 17 12">
        <rect x="0"  y="8"  width="3" height="4" rx="1"/>
        <rect x="4.5" y="5" width="3" height="7" rx="1"/>
        <rect x="9" y="2.5" width="3" height="9.5" rx="1"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12">
        <path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
        <path d="M3.5 6.5a6.5 6.5 0 019 0" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M1 3.5a10 10 0 0114 0" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12">
        <rect x="0" y="1" width="21" height="10" rx="2.5" stroke="rgba(255,255,255,0.8)" stroke-width="1.2" fill="none"/>
        <rect x="1.5" y="2.5" width="15" height="7" rx="1.5" fill="rgba(255,255,255,0.8)"/>
        <path d="M22 4v4a2 2 0 000-4z" fill="rgba(255,255,255,0.8)"/>
      </svg>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="close-btn">
      <svg width="14" height="14" viewBox="0 0 14 14">
        <line x1="2" y1="2" x2="12" y2="12"/>
        <line x1="12" y1="2" x2="2" y2="12"/>
      </svg>
    </div>
    <div class="top-label">
      <span class="instruction">Align document in frame</span>
      <span class="shp-ref">SHP-2025-00142</span>
    </div>
    <div class="flash-btn">
      <svg width="16" height="16" viewBox="0 0 16 16">
        <polygon points="9,1 3,9 8,9 7,15 13,7 8,7"/>
      </svg>
    </div>
  </div>

  <!-- Viewfinder -->
  <div class="viewfinder">
    <div class="doc-outline">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="doc-hint">
        <svg width="44" height="44" viewBox="0 0 44 44">
          <rect x="8" y="4" width="24" height="32" rx="3"/>
          <path d="M14 16h16M14 22h16M14 28h10" stroke-linecap="round"/>
          <path d="M28 4v10h12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Place delivery receipt<br/>inside the frame</span>
      </div>
    </div>
  </div>

  <!-- Bottom Action Bar -->
  <div class="bottom-bar">
    <button class="btn-retake">
      <svg width="16" height="16" viewBox="0 0 16 16">
        <path d="M2 8a6 6 0 1010.4-4.1" stroke-linecap="round"/>
        <polyline points="9,1 13,4 9,7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Retake
    </button>
    <button class="btn-confirm">
      <svg width="16" height="16" viewBox="0 0 16 16">
        <rect x="2" y="9" width="12" height="5" rx="1.5"/>
        <path d="M8 1v8M5 4l3-3 3 3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Confirm Upload
    </button>
  </div>

  <!-- Home Indicator -->
  <div class="home-indicator"><span></span></div>

</div><!-- /phone -->

</body>
</html>
